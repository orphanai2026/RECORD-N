name: Recover GitHub Pages

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/recover-pages.yml"

permissions:
  contents: read
  pages: write

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel stuck Pages deployment
        env:
          GH_TOKEN: ${{ github.token }}
          STUCK_DEPLOYMENT_ID: f82f56d9aef379120fd48539a825c7e8432b6808
        run: |
          set -euo pipefail
          endpoint="https://api.github.com/repos/${GITHUB_REPOSITORY}/pages/deployments/${STUCK_DEPLOYMENT_ID}/cancel"
          for attempt in 1 2 3; do
            code=$(curl -sS -o cancel-response.json -w "%{http_code}" \
              -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$endpoint")
            cat cancel-response.json || true
            if [ "$code" = "202" ] || [ "$code" = "204" ] || [ "$code" = "404" ]; then
              echo "Cancel request accepted or deployment already absent (HTTP $code)."
              exit 0
            fi
            echo "Cancel attempt $attempt returned HTTP $code; retrying..."
            sleep 5
          done
          echo "Unable to cancel the stuck Pages deployment."
          exit 1

      - name: Request a fresh Pages build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sleep 10
          code=$(curl -sS -o build-response.json -w "%{http_code}" \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages/builds")
          cat build-response.json || true
          if [ "$code" != "201" ] && [ "$code" != "202" ]; then
            echo "Fresh Pages build request failed with HTTP $code."
            exit 1
          fi
          echo "Fresh Pages build requested successfully."
