name: Recreate GitHub Pages

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/recover-pages.yml"

permissions:
  contents: read
  pages: write

jobs:
  recreate:
    runs-on: ubuntu-latest
    steps:
      - name: Delete current Pages site
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/pages"
          code=$(curl -sS -o delete-response.json -w "%{http_code}" \
            -X DELETE \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$api")
          cat delete-response.json || true
          if [ "$code" != "204" ] && [ "$code" != "404" ]; then
            echo "Deleting Pages site failed with HTTP $code."
            exit 1
          fi
          echo "Pages site deleted or already absent."

      - name: Wait for Pages removal
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/pages"
          for attempt in $(seq 1 24); do
            code=$(curl -sS -o status-response.json -w "%{http_code}" \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$api")
            if [ "$code" = "404" ]; then
              echo "Pages site removal confirmed."
              exit 0
            fi
            echo "Pages removal not complete yet (HTTP $code), attempt $attempt/24."
            sleep 5
          done
          echo "Timed out waiting for Pages site removal."
          exit 1

      - name: Recreate Pages from main root
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/pages"
          payload='{"source":{"branch":"main","path":"/"},"build_type":"legacy"}'
          code=$(curl -sS -o create-response.json -w "%{http_code}" \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Content-Type: application/json" \
            -d "$payload" \
            "$api")
          cat create-response.json || true
          if [ "$code" != "201" ]; then
            echo "Recreating Pages site failed with HTTP $code."
            exit 1
          fi
          echo "Pages site recreated from main/root."

      - name: Request fresh Pages build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sleep 10
          code=$(curl -sS -o build-response.json -w "%{http_code}" \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages/builds")
          cat build-response.json || true
          if [ "$code" != "201" ] && [ "$code" != "202" ]; then
            echo "Fresh Pages build request failed with HTTP $code."
            exit 1
          fi
          echo "Fresh Pages build requested successfully."
