name: Apply automatic recording and modal fix

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-auto-record-modal-fix.yml

permissions:
  contents: write

concurrency:
  group: record-n-auto-record-modal-fix
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply patch
        run: python scripts/patch-auto-record-and-modal.py

      - name: Remove temporary patch files
        run: |
          rm -f scripts/patch-auto-record-and-modal.py
          rm -f .github/workflows/apply-auto-record-modal-fix.yml

      - name: Run checks
        run: npm run check

      - name: Commit directly to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --stat
          git commit -m "fix: enforce accurate automatic recording and contain settings modal"
          git push origin HEAD:main
