name: Apply approved recording upgrade

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-approved-recording-upgrade.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply approved changes
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          root = Path('.')
          index = (root / 'index.html').read_text()
          app = (root / 'app.js').read_text()
          styles = (root / 'styles.css').read_text()
          calibration = (root / 'calibration.css').read_text()
          check = (root / 'scripts/check.mjs').read_text()

          # Cache version.
          index = re.sub(r'2026-08-06-r4', '2026-08-06-r5', index)

          # Header navigation: replace duplicate help icon with clear tabs.
          old_help = '''      <button class="icon-button help-button" id="helpButton" type="button" aria-label="فتح المساعدة" title="مساعدة">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle><path d="M9.1 9a3 3 0 1 1 5.4 1.8c-1.2.8-2 1.3-2 2.7"></path><path d="M12 17h.01"></path></svg>
      </button>'''
          new_nav = '''      <nav class="header-tabs" aria-label="روابط التعريف">
        <button class="header-tab" id="helpButton" type="button">طريقة الاستخدام</button>
        <button class="header-tab" id="aboutButton" type="button">من نحن</button>
      </nav>'''
          if old_help not in index:
              raise SystemExit('header help anchor not found')
          index = index.replace(old_help, new_nav, 1)

          # Tuner labels and state badge.
          index = index.replace('<div class="tuner-labels"><span>منخفض ♭</span><span>مضبوط</span><span>مرتفع ♯</span></div>', '<div class="tuner-labels"><span class="tuner-label tuner-label--flat">منخفض ♭</span><span class="tuner-label tuner-label--tuned">مضبوط</span><span class="tuner-label tuner-label--sharp">مرتفع ♯</span></div>', 1)
          index = index.replace('<span class="tuner-needle" id="tunerNeedle" aria-hidden="true"></span>', '<span class="tuner-needle" id="tunerNeedle" aria-hidden="true"><bdi class="tuner-needle-value" id="tunerNeedleValue" dir="ltr">0.0</bdi></span>', 1)
          index = index.replace('<div class="metric-card"><span>الانحراف</span><strong id="centsValue" dir="ltr">0 <small>سنت</small></strong></div>', '<div class="metric-card metric-card--deviation" id="deviationMetric"><span>الانحراف</span><strong id="centsValue" dir="ltr">0 <small>سنت</small></strong><small class="metric-state" id="tuningStateText">بانتظار النغمة</small></div>', 1)
          index = index.replace('<div class="metric-card"><span>الإشارة/الضوضاء</span><strong id="signalValue" dir="ltr">—</strong></div>', '<div class="metric-card metric-card--signal"><span>جودة الإشارة</span><strong id="signalValue" dir="ltr">—</strong><span class="signal-meter" aria-hidden="true"><i id="signalMeterFill"></i></span></div>', 1)

          # Recording mode controls before the preparation button.
          prepare_anchor = re.search(r'(?P<indent>\s*)<button[^>]+id="prepareButton"[\s\S]*?</button>', index)
          if not prepare_anchor:
              raise SystemExit('prepare button anchor not found')
          prepare_button = prepare_anchor.group(0)
          recording_controls = '''
        <section class="recording-workflow" aria-labelledby="recordingModeTitle">
          <div class="recording-workflow__header">
            <div><h3 id="recordingModeTitle">وضع التسجيل</h3><p>اختر نغمة منفصلة أو جلسة سلم كروماتك متتابعة</p></div>
            <div class="segmented-control recording-mode-control" id="recordingModeControl">
              <button class="segment is-active" data-recording-mode="single" type="button" aria-pressed="true">منفصل</button>
              <button class="segment" data-recording-mode="chromatic" type="button" aria-pressed="false">سلم كروماتك</button>
            </div>
          </div>
          <div class="chromatic-settings" id="chromaticSettings" hidden>
            <label>نغمة البداية<select id="chromaticStart"></select></label>
            <label>نغمة النهاية<select id="chromaticEnd"></select></label>
            <label>الاتجاه<select id="chromaticDirection"><option value="up">صاعد</option><option value="down">هابط</option></select></label>
            <button class="ghost-button" id="buildChromaticButton" type="button">تجهيز السلم</button>
          </div>
          <div class="recording-session-status" id="recordingSessionStatus" aria-live="polite">
            <div><span>الحالة</span><strong id="recordingPhase">جاهز</strong></div>
            <div><span>التأهيل</span><strong id="qualificationCount">0 / 3</strong></div>
            <div><span>الدقة</span><strong id="liveAccuracy">—</strong></div>
            <div><span>الجودة</span><strong id="liveClarity">—</strong></div>
          </div>
          <div class="chromatic-progress" id="chromaticProgress" hidden>
            <div><span id="chromaticProgressText">لم تبدأ الجلسة</span><strong id="chromaticTargetText">—</strong></div>
            <progress id="chromaticProgressBar" max="1" value="0"></progress>
            <div class="chromatic-actions"><button class="ghost-button" id="pauseChromaticButton" type="button">إيقاف مؤقت</button><button class="ghost-button" id="endChromaticButton" type="button">إنهاء الجلسة</button></div>
          </div>
        </section>
'''
          index = index[:prepare_anchor.start()] + recording_controls + prepare_button + index[prepare_anchor.end():]

          # Add about dialog before advanced dialog or before body end.
          about_dialog = '''
  <dialog class="app-dialog information-dialog" id="aboutDialog">
    <form method="dialog" class="dialog-card">
      <header><div><h2>من نحن</h2><p>مشروع عربي لإعداد وتوثيق نغمات الناي بدقة.</p></div><button class="icon-button dialog-close" value="cancel" aria-label="إغلاق">×</button></header>
      <div class="information-content">
        <p><strong>معيار الناي</strong> أداة متخصصة لقياس النغمات الشرقية وتسجيلها وفق مرجع قابل للضبط، مع دعم 12-TET و24-TET.</p>
        <p>تهدف الأداة إلى إنتاج تسجيلات مرجعية دقيقة تساعد في بناء منصة تعليم الناي العربي.</p>
        <dl><div><dt>المالك</dt><dd>محمد الزهراني</dd></div><div><dt>الإصدار</dt><dd id="aboutVersion">وفق VERSION.json</dd></div><div><dt>المستودع</dt><dd><a href="https://github.com/orphanai2026/RECORD-N" target="_blank" rel="noopener">orphanai2026/RECORD-N</a></dd></div></dl>
      </div>
    </form>
  </dialog>
'''
          advanced_pos = index.find('<dialog', index.find('id="helpDialog"') + 1)
          if advanced_pos == -1:
              advanced_pos = index.rfind('</body>')
          index = index[:advanced_pos] + about_dialog + index[advanced_pos:]

          # Add final quality threshold to advanced settings before persist setting.
          persist_anchor = '<input id="persistSettings"'
          persist_pos = index.find(persist_anchor)
          if persist_pos != -1:
              label_start = index.rfind('<label', 0, persist_pos)
              quality_setting = '''
            <label class="setting-row setting-row--range">
              <span><strong>جودة اعتماد التسجيل</strong><small>الحد الأدنى لمتوسط جودة الإشارة في التسجيل المقبول</small></span>
              <span class="range-field"><input id="recordingQualityRange" type="range" min="65" max="100" step="1" value="90"><output id="recordingQualityOutput">90%</output></span>
            </label>
'''
              index = index[:label_start] + quality_setting + index[label_start:]

          # State additions.
          app = app.replace("    recordingQualifyingFrames: 0,\n", "    recordingQualifyingFrames: 0,\n    lastQualificationSampleAt: 0,\n    recordingMode: 'single',\n    recordingQualityThreshold: .90,\n    chromaticNotes: [],\n    chromaticIndex: 0,\n    chromaticActive: false,\n    chromaticPaused: false,\n", 1)

          # UI additions.
          app = app.replace("    tunerHighLabel: $('#tunerHighLabel')\n", "    tunerHighLabel: $('#tunerHighLabel'),\n    tunerNeedleValue: $('#tunerNeedleValue'),\n    tuningStateText: $('#tuningStateText'),\n    deviationMetric: $('#deviationMetric'),\n    signalMeterFill: $('#signalMeterFill'),\n    aboutDialog: $('#aboutDialog'),\n    recordingPhase: $('#recordingPhase'),\n    qualificationCount: $('#qualificationCount'),\n    liveAccuracy: $('#liveAccuracy'),\n    liveClarity: $('#liveClarity')\n", 1)

          # Pitch UI visual state.
          old_pitch_tail = "    ui.needle.style.left = `${50 + cents}%`;\n"
          new_pitch_tail = "    ui.needle.style.left = `${50 + cents}%`;\n    const tuningState = Math.abs(note.cents) <= tolerance ? 'tuned' : note.cents < -tolerance ? 'flat' : 'sharp';\n    const tuningLabel = tuningState === 'tuned' ? 'مضبوط' : tuningState === 'flat' ? 'منخفض' : 'مرتفع';\n    ui.tunerNeedleValue.textContent = `${note.cents > 0 ? '+' : ''}${note.cents.toFixed(1)}`;\n    ui.tuningStateText.textContent = tuningLabel;\n    ui.deviationMetric.dataset.state = tuningState;\n    ui.signalMeterFill.style.width = `${Math.round(result.clarity * 100)}%`;\n"
          if old_pitch_tail not in app:
              raise SystemExit('pitch UI anchor not found')
          app = app.replace(old_pitch_tail, new_pitch_tail, 1)
          app = app.replace("    ui.needle.style.left = '50%';\n", "    ui.needle.style.left = '50%';\n    ui.tunerNeedleValue.textContent = '0.0';\n    ui.tuningStateText.textContent = 'بانتظار النغمة';\n    ui.deviationMetric.dataset.state = 'idle';\n    ui.signalMeterFill.style.width = '0%';\n", 1)

          # Qualification reset and status helpers.
          app = app.replace("    state.recordingCandidateKey = null;\n  }\n\n  function setPrepareButtonState", "    state.recordingCandidateKey = null;\n    state.lastQualificationSampleAt = 0;\n    if (ui.qualificationCount) ui.qualificationCount.textContent = '0 / 3';\n  }\n\n  function updateRecordingStatus(phase, stats = state.recordingStats) {\n    if (ui.recordingPhase) ui.recordingPhase.textContent = phase;\n    if (!stats) { if (ui.liveAccuracy) ui.liveAccuracy.textContent = '—'; if (ui.liveClarity) ui.liveClarity.textContent = '—'; return; }\n    const ratio = stats.totalFrames ? Math.round(stats.validFrames / stats.totalFrames * 100) : 0;\n    const clarity = stats.measuredFrames ? Math.round(stats.claritySumAll / stats.measuredFrames * 100) : 0;\n    if (ui.liveAccuracy) ui.liveAccuracy.textContent = `${ratio}%`;\n    if (ui.liveClarity) ui.liveClarity.textContent = `${clarity}%`;\n  }\n\n  function setPrepareButtonState", 1)
          app = app.replace("    if (mode === 'armed') label.textContent = progress > 0 ? `تثبيت النغمة ${progress}%` : 'بانتظار نغمة مضبوطة…';\n", "    if (mode === 'armed') label.textContent = progress > 0 ? `تثبيت النغمة ${progress}%` : 'بانتظار نغمة مضبوطة…';\n    if (mode === 'armed') updateRecordingStatus(progress > 0 ? 'التحقق من الثبات' : 'انتظار نغمة');\n", 1)
          app = app.replace("    else if (mode === 'recording') label.textContent = 'جارٍ التسجيل التلقائي…';\n    else label.textContent = 'تجهيز تسجيل النغمة';\n", "    else if (mode === 'recording') { label.textContent = 'جارٍ التسجيل التلقائي…'; updateRecordingStatus('تسجيل'); }\n    else { label.textContent = state.recordingMode === 'chromatic' ? 'بدء جلسة السلم' : 'تجهيز تسجيل النغمة'; updateRecordingStatus('جاهز', null); }\n", 1)

          # Replace automatic recording evaluator.
          evaluator_pattern = re.compile(r"  function evaluateAutomaticRecording\(result, note, stable\) \{[\s\S]*?\n  \}\n\n  function beginAutomaticRecording", re.M)
          evaluator_replacement = '''  function expectedChromaticKey() {
    return state.chromaticActive ? state.chromaticNotes[state.chromaticIndex]?.key : null;
  }

  function evaluateAutomaticRecording(result, note, stable) {
    const now = performance.now();
    const recorderActive = state.mediaRecorder?.state === 'recording';
    const tolerance = Number($('#toleranceRange')?.value || 12);
    const startClarityThreshold = .65;
    const key = recordingNoteKey(note);
    const expectedKey = expectedChromaticKey();
    const correctTarget = !expectedKey || key === expectedKey;
    const validReading = Boolean(result && note && stable && correctTarget && Math.abs(note.cents) <= tolerance && result.clarity >= startClarityThreshold);

    if (recorderActive && state.recordingStats) {
      if (now - state.recordingStats.lastSampleAt < 100) return;
      state.recordingStats.lastSampleAt = now;
      const stats = state.recordingStats;
      stats.totalFrames += 1;
      const sameNote = key === stats.noteKey;
      if (result && note && sameNote) {
        stats.measuredFrames += 1;
        stats.centsSumAll += Math.abs(note.cents);
        stats.claritySumAll += result.clarity;
        stats.frequencySum += result.frequency;
      }
      if (validReading && sameNote) stats.validFrames += 1;
      else stats.invalidFrames += 1;
      updateRecordingStatus('تسجيل ومراقبة', stats);
      return;
    }

    if (!state.recordingArmed || state.chromaticPaused) return;
    if (now - state.lastQualificationSampleAt < 100) return;
    state.lastQualificationSampleAt = now;

    if (!validReading) {
      state.recordingQualifyingFrames = 0;
      state.recordingCandidateKey = null;
      if (ui.qualificationCount) ui.qualificationCount.textContent = '0 / 3';
      setPrepareButtonState('armed');
      return;
    }

    if (state.recordingCandidateKey !== key) {
      state.recordingCandidateKey = key;
      state.recordingQualifyingFrames = 1;
    } else state.recordingQualifyingFrames += 1;

    if (ui.qualificationCount) ui.qualificationCount.textContent = `${state.recordingQualifyingFrames} / 3`;
    const progress = Math.min(100, Math.round(state.recordingQualifyingFrames / 3 * 100));
    setPrepareButtonState('armed', progress);
    if (state.recordingQualifyingFrames >= 3) beginAutomaticRecording(note, result);
  }

  function beginAutomaticRecording'''
          app, count = evaluator_pattern.subn(evaluator_replacement, app, count=1)
          if count != 1:
              raise SystemExit('automatic recording evaluator not replaced')

          # Recording stats.
          app = app.replace("      centsSum: 0,\n      claritySum: 0,\n      frequencySum: 0,\n", "      centsSumAll: 0,\n      claritySumAll: 0,\n      measuredFrames: 0,\n      frequencySum: 0,\n      lastSampleAt: 0,\n", 1)

          # Acceptance rules and rejection details.
          old_accept = "    const averageCents = stats.validFrames ? stats.centsSum / stats.validFrames : Infinity;\n    const averageClarity = stats.validFrames ? stats.claritySum / stats.validFrames : 0;\n    const accepted = stats.totalFrames >= 6 && validRatio >= .85 && averageCents <= tolerance && averageClarity >= .65;\n"
          new_accept = "    const averageCents = stats.measuredFrames ? stats.centsSumAll / stats.measuredFrames : Infinity;\n    const averageClarity = stats.measuredFrames ? stats.claritySumAll / stats.measuredFrames : 0;\n    const accepted = stats.totalFrames >= 3 && validRatio >= .90 && averageCents <= tolerance && averageClarity >= state.recordingQualityThreshold;\n"
          if old_accept not in app:
              raise SystemExit('acceptance anchor not found')
          app = app.replace(old_accept, new_accept, 1)
          old_reject = "      showToast('لم يُحفظ التسجيل لأن النغمة فقدت الدقة أو الثبات. ثبّتها وسيعاد التسجيل تلقائيًا.');\n"
          new_reject = "      const reasons = [`الدقة ${Math.round(validRatio * 100)}%`, `الجودة ${Math.round(averageClarity * 100)}%`, `الانحراف ${Number.isFinite(averageCents) ? averageCents.toFixed(1) : '—'} سنت`];\n      updateRecordingStatus('مرفوض', stats);\n      showToast(`لم يعتمد التسجيل: ${reasons.join(' · ')}. ستعاد المحاولة تلقائيًا.`);\n"
          app = app.replace(old_reject, new_reject, 1)

          # Successful record metadata and chromatic continuation.
          app = app.replace("      clarity: Number((averageClarity * 100).toFixed(1)),\n", "      clarity: Number((averageClarity * 100).toFixed(1)),\n      accuracy: Number((validRatio * 100).toFixed(1)),\n      recordingMode: state.recordingMode,\n      chromaticPosition: state.chromaticActive ? state.chromaticIndex + 1 : null,\n", 1)
          old_success_tail = "    state.recordingStats = null;\n    state.recordingArmed = false;\n    resetRecordingQualification();\n    setPrepareButtonState('idle');\n    renderRecords();\n    showToast('تم اعتماد وحفظ التسجيل المضبوط تلقائيًا.');\n"
          new_success_tail = "    state.recordingStats = null;\n    resetRecordingQualification();\n    renderRecords();\n    if (state.recordingMode === 'chromatic' && state.chromaticActive) {\n      state.chromaticIndex += 1;\n      if (state.chromaticIndex >= state.chromaticNotes.length) {\n        const completed = state.chromaticNotes.length;\n        state.chromaticActive = false; state.recordingArmed = false; setPrepareButtonState('idle'); updateChromaticProgress();\n        showToast(`اكتملت جلسة السلم: ${completed} نغمة معتمدة.`);\n      } else {\n        state.recordingArmed = true; setPrepareButtonState('armed'); updateChromaticProgress();\n        showToast('تم اعتماد النغمة والانتقال تلقائيًا إلى التالية.');\n      }\n    } else {\n      state.recordingArmed = false; setPrepareButtonState('idle'); showToast('تم اعتماد وحفظ التسجيل المضبوط تلقائيًا.');\n    }\n"
          if old_success_tail not in app:
              raise SystemExit('success tail anchor not found')
          app = app.replace(old_success_tail, new_success_tail, 1)

          # Chromatic helpers before bindEvents.
          chromatic_helpers = '''
  function buildNoteOptions() {
    const start = $('#chromaticStart');
    const end = $('#chromaticEnd');
    if (!start || !end) return;
    const options = [];
    for (let octave = 2; octave <= 7; octave += 1) {
      for (let step = 0; step < state.division; step += 1) {
        const absolute = (octave * state.division) + step;
        const target = state.a4 * 2 ** ((absolute - (4 * state.division + (state.division === 12 ? 9 : 18))) / state.division);
        if (target < state.minFrequency || target > state.maxFrequency) continue;
        const note = noteFromFrequency(target);
        options.push({ key: recordingNoteKey(note), note, absolute });
      }
    }
    const html = options.map((item, index) => `<option value="${index}">${item.note.arabic} — ${item.note.english}</option>`).join('');
    start.innerHTML = html; end.innerHTML = html;
    start.value = '0'; end.value = String(Math.min(options.length - 1, state.division));
    start._noteOptions = options; end._noteOptions = options;
  }

  function buildChromaticSession() {
    const options = $('#chromaticStart')._noteOptions || [];
    let startIndex = Number($('#chromaticStart').value);
    let endIndex = Number($('#chromaticEnd').value);
    const direction = $('#chromaticDirection').value;
    if (direction === 'up' && startIndex > endIndex) [startIndex, endIndex] = [endIndex, startIndex];
    if (direction === 'down' && startIndex < endIndex) [startIndex, endIndex] = [endIndex, startIndex];
    const step = direction === 'up' ? 1 : -1;
    state.chromaticNotes = [];
    for (let index = startIndex; direction === 'up' ? index <= endIndex : index >= endIndex; index += step) state.chromaticNotes.push(options[index]);
    state.chromaticIndex = 0; state.chromaticActive = false; state.chromaticPaused = false;
    updateChromaticProgress();
    showToast(`تم تجهيز سلم من ${state.chromaticNotes.length} نغمة.`);
  }

  function updateChromaticProgress() {
    const box = $('#chromaticProgress');
    if (!box) return;
    box.hidden = state.recordingMode !== 'chromatic';
    const total = state.chromaticNotes.length;
    const current = state.chromaticNotes[state.chromaticIndex];
    $('#chromaticProgressBar').max = Math.max(1, total);
    $('#chromaticProgressBar').value = Math.min(state.chromaticIndex, total);
    $('#chromaticProgressText').textContent = total ? `${Math.min(state.chromaticIndex + 1, total)} من ${total}` : 'جهّز السلم أولًا';
    $('#chromaticTargetText').textContent = current ? `المطلوب: ${current.note.arabic} · التالي: ${state.chromaticNotes[state.chromaticIndex + 1]?.note.arabic || 'النهاية'}` : '—';
  }

  function setRecordingMode(mode) {
    if (state.mediaRecorder?.state === 'recording') return;
    state.recordingMode = mode;
    chooseExclusive($$('#recordingModeControl .segment'), $(`#recordingModeControl [data-recording-mode="${mode}"]`));
    $('#chromaticSettings').hidden = mode !== 'chromatic';
    if (mode === 'chromatic') { buildNoteOptions(); updateChromaticProgress(); }
    else { state.chromaticActive = false; state.chromaticPaused = false; $('#chromaticProgress').hidden = true; }
    setPrepareButtonState('idle');
  }

'''
          app = app.replace("  function bindEvents() {\n", chromatic_helpers + "  function bindEvents() {\n", 1)

          # Prepare behavior for chromatic start.
          app = app.replace("    state.recordingArmed = true;\n    state.discardRecording = false;\n", "    if (state.recordingMode === 'chromatic') {\n      if (!state.chromaticNotes.length) { showToast('جهّز نطاق السلم أولًا.'); return; }\n      state.chromaticActive = true; state.chromaticPaused = false; updateChromaticProgress();\n    }\n    state.recordingArmed = true;\n    state.discardRecording = false;\n", 1)

          # Bind new controls/dialog/settings.
          app = app.replace("    $('#helpButton').addEventListener('click', () => ui.helpDialog.showModal());\n", "    $('#helpButton').addEventListener('click', () => ui.helpDialog.showModal());\n    $('#aboutButton').addEventListener('click', () => ui.aboutDialog.showModal());\n    $$('#recordingModeControl .segment').forEach(button => button.addEventListener('click', () => setRecordingMode(button.dataset.recordingMode)));\n    $('#buildChromaticButton').addEventListener('click', buildChromaticSession);\n    $('#pauseChromaticButton').addEventListener('click', () => { state.chromaticPaused = !state.chromaticPaused; $('#pauseChromaticButton').textContent = state.chromaticPaused ? 'استكمال' : 'إيقاف مؤقت'; updateRecordingStatus(state.chromaticPaused ? 'متوقف مؤقتًا' : 'انتظار نغمة'); });\n    $('#endChromaticButton').addEventListener('click', () => { const completed = state.chromaticIndex; const remaining = Math.max(0, state.chromaticNotes.length - completed); state.chromaticActive = false; state.recordingArmed = false; state.chromaticPaused = false; resetRecordingQualification(); setPrepareButtonState('idle'); updateChromaticProgress(); showToast(`انتهت الجلسة: ${completed} مكتملة · ${remaining} متبقية.`); });\n", 1)
          app = app.replace("    $('#toleranceRange').addEventListener('input', updateToleranceVisualization);\n", "    $('#toleranceRange').addEventListener('input', updateToleranceVisualization);\n    $('#recordingQualityRange').addEventListener('input', event => { $('#recordingQualityOutput').textContent = `${event.target.value}%`; state.recordingQualityThreshold = Number(event.target.value) / 100; });\n", 1)

          # Settings persistence.
          app = app.replace("    fileNamePattern: '{note}-{duration}-{date}',\n", "    fileNamePattern: '{note}-{duration}-{date}',\n    recordingQuality: 90,\n", 1)
          app = app.replace("      fileNamePattern: $('#fileNamePattern')?.value || defaultSettings.fileNamePattern,\n", "      fileNamePattern: $('#fileNamePattern')?.value || defaultSettings.fileNamePattern,\n      recordingQuality: Number($('#recordingQualityRange')?.value || defaultSettings.recordingQuality),\n", 1)
          app = app.replace("    $('#fileNamePattern').value = values.fileNamePattern;\n", "    $('#fileNamePattern').value = values.fileNamePattern;\n    $('#recordingQualityRange').value = values.recordingQuality;\n    $('#recordingQualityOutput').textContent = `${values.recordingQuality}%`;\n", 1)
          app = app.replace("    state.mp3Bitrate = Number(values.mp3Bitrate);\n", "    state.mp3Bitrate = Number(values.mp3Bitrate);\n    state.recordingQualityThreshold = Number(values.recordingQuality) / 100;\n", 1)
          app = app.replace("    updateDiagnostics();\n    resetPitchUI();\n", "    updateDiagnostics();\n    setRecordingMode('single');\n    buildNoteOptions();\n    resetPitchUI();\n", 1)

          # Append interface styling.
          styles += r'''

/* Approved recording and tuner upgrade */
.header-tabs{display:flex;gap:.45rem;align-items:center}.header-tab{border:1px solid rgba(207,168,68,.4);background:rgba(0,30,33,.7);color:var(--gold-100);border-radius:999px;padding:.65rem 1rem;font:inherit;cursor:pointer;white-space:nowrap}.header-tab:hover,.header-tab:focus-visible{background:rgba(207,168,68,.14);border-color:rgba(207,168,68,.8)}
.tuner-label{font-weight:800}.tuner-label--flat{color:#ffd166}.tuner-label--tuned{color:#70f0b1}.tuner-label--sharp{color:#ff756d}.tuner-bar{background:linear-gradient(90deg,#f2bf43 0%,#ffdc63 34%,#2cce83 43%,#55e49e 57%,#f06a5f 67%,#d9463e 100%);box-shadow:inset 0 0 0 1px rgba(255,255,255,.24),0 0 28px rgba(44,206,131,.12)}.tuner-center-zone{background:linear-gradient(180deg,rgba(73,231,152,.36),rgba(20,130,88,.18));border:1px solid rgba(154,255,211,.85);box-shadow:0 0 22px rgba(50,226,143,.42),inset 0 0 16px rgba(155,255,211,.18)}.tuner-needle{width:5px;background:#fff8df;box-shadow:0 0 0 5px rgba(255,255,255,.12),0 0 18px rgba(255,255,255,.75)}.tuner-needle-value{position:absolute;top:-2.35rem;left:50%;transform:translateX(-50%);min-width:3.5rem;padding:.25rem .45rem;border-radius:.65rem;background:#081f20;border:1px solid currentColor;color:#f5ead0;font-size:.78rem;text-align:center}.metric-card--deviation[data-state="flat"]{border-color:rgba(255,209,102,.72);box-shadow:inset 0 -3px 0 #f1bd43}.metric-card--deviation[data-state="tuned"]{border-color:rgba(88,229,157,.72);box-shadow:inset 0 -3px 0 #38cf89}.metric-card--deviation[data-state="sharp"]{border-color:rgba(255,111,102,.72);box-shadow:inset 0 -3px 0 #e9574d}.metric-state{display:block;margin-top:.35rem}.signal-meter{display:block;height:.45rem;margin-top:.55rem;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden}.signal-meter i{display:block;height:100%;width:0;background:linear-gradient(90deg,#f1bd43,#3bd08b);transition:width .14s ease}
.recording-workflow{margin:0 0 1rem;padding:1rem;border:1px solid rgba(207,168,68,.26);border-radius:1.2rem;background:linear-gradient(145deg,rgba(1,38,40,.72),rgba(0,23,27,.88))}.recording-workflow__header{display:flex;align-items:center;justify-content:space-between;gap:1rem}.recording-workflow h3{margin:0 0 .25rem}.recording-workflow p{margin:0;color:var(--text-muted)}.recording-mode-control{min-width:16rem}.chromatic-settings{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:.75rem;margin-top:1rem}.chromatic-settings label{display:grid;gap:.35rem;color:var(--text-muted)}.chromatic-settings select{width:100%;min-width:0}.recording-session-status{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:.65rem;margin-top:1rem}.recording-session-status>div{padding:.75rem;border-radius:.9rem;background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.07)}.recording-session-status span{display:block;color:var(--text-muted);font-size:.82rem}.recording-session-status strong{display:block;margin-top:.25rem}.chromatic-progress{margin-top:1rem;padding:.85rem;border-radius:1rem;background:rgba(0,0,0,.16)}.chromatic-progress>div:first-child{display:flex;justify-content:space-between;gap:1rem}.chromatic-progress progress{width:100%;height:.65rem;margin:.7rem 0}.chromatic-actions{display:flex;gap:.5rem;justify-content:flex-end}.information-dialog .information-content{display:grid;gap:1rem}.information-content dl{display:grid;gap:.65rem}.information-content dl>div{display:grid;grid-template-columns:8rem 1fr;gap:1rem;padding:.65rem;border-bottom:1px solid rgba(255,255,255,.08)}.information-content dt{color:var(--text-muted)}.information-content a{color:var(--gold-100)}
@media(max-width:900px){.app-header{grid-template-columns:1fr auto}.header-tabs{grid-column:1/-1;justify-content:center;order:3}.recording-workflow__header{align-items:stretch;flex-direction:column}.recording-mode-control{min-width:0}.chromatic-settings{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:640px){.header-tabs{width:100%}.header-tab{flex:1;padding:.58rem .5rem}.recording-session-status{grid-template-columns:repeat(2,minmax(0,1fr))}.chromatic-settings{grid-template-columns:1fr}.chromatic-progress>div:first-child{flex-direction:column}.information-content dl>div{grid-template-columns:1fr;gap:.25rem}}
'''

          # Prevent advanced dialog clipping and ensure no horizontal overflow.
          calibration += r'''

.advanced-dialog .dialog-card,.information-dialog .dialog-card{width:min(94vw,920px);max-width:100%;max-height:min(90dvh,900px);overflow-y:auto;overflow-x:hidden}.advanced-dialog *,.information-dialog *{box-sizing:border-box;min-width:0}.setting-row,.range-field{max-width:100%}
'''

          # Quality checks for approved features.
          check = check.replace('"id=\\"tunerLowLimit\\"', '"id=\\"tunerLowLimit\\"", "id=\\"recordingModeControl\\"", "id=\\"chromaticSettings\\"", "id=\\"aboutDialog\\"", "id=\\"recordingQualityRange\\"')
          check = check.replace('"beginAutomaticRecording"', '"beginAutomaticRecording", "buildChromaticSession", "updateChromaticProgress", "recordingQualityThreshold"')
          check = check.replace('".tuner-bar"', '".tuner-bar", ".recording-workflow", ".header-tabs"')

          (root / 'index.html').write_text(index)
          (root / 'app.js').write_text(app)
          (root / 'styles.css').write_text(styles)
          (root / 'calibration.css').write_text(calibration)
          (root / 'scripts/check.mjs').write_text(check)
          PY

          npm run check
          rm .github/workflows/apply-approved-recording-upgrade.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html app.js styles.css calibration.css scripts/check.mjs .github/workflows/apply-approved-recording-upgrade.yml
          git commit -m "feat: add approved recording modes and tuner experience"
          git push origin main
