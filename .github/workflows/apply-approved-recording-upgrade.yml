name: Apply approved recording upgrade

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-approved-recording-upgrade.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Recover and execute approved patch
        shell: bash
        run: |
          git show HEAD^:.github/workflows/apply-approved-recording-upgrade.yml > /tmp/upgrade-source.yml
          python3 - <<'PY'
          from pathlib import Path
          source = Path('/tmp/upgrade-source.yml').read_text()
          start = source.index("          python3 <<'PY'\n") + len("          python3 <<'PY'\n")
          end = source.index("\n          PY\n", start)
          lines = source[start:end].splitlines()
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines) + '\n'
          Path('/tmp/apply-upgrade.py').write_text(script)
          PY
          python3 /tmp/apply-upgrade.py
          npm run check
          rm .github/workflows/apply-approved-recording-upgrade.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html app.js styles.css calibration.css scripts/check.mjs .github/workflows/apply-approved-recording-upgrade.yml
          git commit -m "feat: add approved recording modes and tuner experience"
          git push origin main
