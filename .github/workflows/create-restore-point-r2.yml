name: Create restore point r2

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/create-restore-point-r2.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      TAG_NAME: checkpoint-2026.08.06-r2
      TARGET_SHA: e1ed54309bf3ae413f1119ccdd427321bb488746
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create restore release
        shell: bash
        run: |
          cat > /tmp/restore-notes.md <<'EOF'
          ## نقطة استعادة معتمدة لمشروع معيار الناي

          تمثل هذه النسخة آخر حالة منشورة ومعتمدة بتاريخ 6 أغسطس 2026 قبل الانتقال إلى مناقشة تحسين نسب رأس الصفحة.

          **Commit المثبت:** `e1ed54309bf3ae413f1119ccdd427321bb488746`

          ### أبرز ما تتضمنه
          - المعيار اللحظي ودعم 12-TET و24-TET.
          - التسجيل التلقائي المشروط بالدقة والثبات وجودة الإشارة.
          - وضع التسجيل المنفصل والسلم الكروماتك.
          - التصدير بصيغ WAV عالي الدقة وMP3 وJSON.
          - العرض الرقمي وتصحيح ألوان منخفض/مضبوط/مرتفع.
          - نافذتا طريقة الاستخدام ومن نحن بالتصميم المنظم.
          - تحسين الخطوط وتوزيع الكتل.
          - عنوان «معيار الناي» بخط Aref Ruqaa Ink وتدرج ذهبي.
          - وصف مستقل: «مسجل ومعيار النغمات الشرقية».
          - شارة ديناميكية مستقلة لمرجع A4.
          - ملف .nojekyll ونشر GitHub Pages ناجح.

          ### نقطة البداية التالية
          مناقشة النسبة البصرية بين حجم عنوان «معيار الناي»، شعار الناي، الوصف، شارة A4، وارتفاع رأس الصفحة دون تنفيذ تعديل قبل الاعتماد.
          EOF

          gh release create "$TAG_NAME" \
            --repo "${{ github.repository }}" \
            --target "$TARGET_SHA" \
            --title "نقطة استعادة معيار الناي — الرأس والهوية r2" \
            --notes-file /tmp/restore-notes.md \
            --latest=false

      - name: Remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/create-restore-point-r2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/create-restore-point-r2.yml
          git commit -m "chore: finalize restore point checkpoint-2026.08.06-r2"
          git push origin main
