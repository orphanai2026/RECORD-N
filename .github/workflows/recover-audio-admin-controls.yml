name: Recover audio and administrative controls

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/recover-audio-admin-controls.yml

permissions:
  contents: write

concurrency:
  group: record-n-audio-admin-recovery-final-2
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Install local MP3 encoder
        run: |
          mkdir -p vendor
          curl --fail --location --retry 3 https://cdn.jsdelivr.net/npm/lamejs@1.2.1/lame.min.js --output vendor/lame.min.js

      - name: Apply updates
        run: python scripts/recover_audio_admin.py

      - name: Run quality checks
        run: npm run check

      - name: Commit directly to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --stat
          git commit -m "feat: expand tuner export and administrative controls"
          git push origin HEAD:main
