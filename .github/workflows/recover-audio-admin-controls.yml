name: Recover audio and administrative controls

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/recover-audio-admin-controls.yml

permissions:
  contents: write

concurrency:
  group: record-n-audio-admin-recovery
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Install local MP3 encoder
        run: |
          mkdir -p vendor
          curl --fail --location --retry 3 https://cdn.jsdelivr.net/npm/lamejs@1.2.1/lame.min.js --output vendor/lame.min.js

      - name: Execute embedded update script
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path('.github/workflows/expand-audio-admin-controls.yml').read_text(encoding='utf-8')
          marker = "          python - <<'PY'\n"
          start = source.index(marker) + len(marker)
          end = source.index("\n          PY", start)
          lines = source[start:end].splitlines()
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines)

          original = """def replace_once(text, old, new, label):
    if old not in text:
        raise SystemExit(f'Missing replacement target: {label}')
    return text.replace(old, new, 1)"""
          tolerant = """def replace_once(text, old, new, label):
    if old in text:
        return text.replace(old, new, 1)
    import re
    parts = [part for part in re.split(r'\\s+', old.strip()) if part]
    pattern = r'\\s+'.join(re.escape(part) for part in parts)
    updated, count = re.subn(pattern, lambda match: new, text, count=1)
    if count != 1:
        raise SystemExit(f'Missing replacement target: {label}')
    return updated"""
          if original not in script:
              raise SystemExit('Could not patch replace_once helper')
          script = script.replace(original, tolerant, 1)

          exec(compile(script, 'embedded-audio-admin-update.py', 'exec'), {})
          Path('.github/workflows/expand-audio-admin-controls.yml').unlink(missing_ok=True)
          Path('.github/workflows/recover-audio-admin-controls.yml').unlink(missing_ok=True)
          PY

      - name: Run quality checks
        run: npm run check

      - name: Commit directly to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --stat
          git commit -m "feat: expand tuner export and administrative controls"
          git push origin HEAD:main
