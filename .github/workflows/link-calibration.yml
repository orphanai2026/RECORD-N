name: Link calibration stylesheet

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/link-calibration.yml

permissions:
  contents: write

jobs:
  link:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Link calibration stylesheet
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('index.html')
          html = path.read_text(encoding='utf-8')
          if 'calibration.css' not in html:
              html = html.replace('</head>', '  <link rel="stylesheet" href="calibration.css?v=2026-08-06-r2">\n</head>')
          html = html.replace('styles.css?v=2026-08-06-r1', 'styles.css?v=2026-08-06-r2')
          html = html.replace('app.js?v=2026-08-06-r1', 'app.js?v=2026-08-06-r2')
          path.write_text(html, encoding='utf-8')
          for workflow in (
              '.github/workflows/link-calibration.yml',
              '.github/workflows/calibrate-reference-layout.yml',
          ):
              target = Path(workflow)
              if target.exists():
                  target.unlink()
          PY

      - name: Run checks
        run: npm run check

      - name: Commit calibration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: fit reference layout within desktop viewport"
          git push origin HEAD:main
