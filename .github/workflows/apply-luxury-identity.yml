name: Apply luxury ney identity

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-luxury-identity.yml

permissions:
  contents: write

concurrency:
  group: record-n-luxury-identity
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Write approved identity files
        shell: bash
        env:
          FILE_1_PATH: theme-ney-luxury.css
          FILE_1_DATA: 
          FILE_2_PATH: vendor/jszip.min.js
          FILE_2_DATA: 
          FILE_3_PATH: scripts/check.mjs
          FILE_3_DATA: 
          FILE_4_PATH: CHANGELOG.md
          FILE_4_DATA: 

        run: |
          python - <<'PY'
          import base64, gzip, os
          from pathlib import Path
          for index in range(1, 5):
              path = Path(os.environ[f'FILE_{index}_PATH'])
              data = gzip.decompress(base64.b64decode(os.environ[f'FILE_{index}_DATA']))
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(data)
          Path('.github/workflows/apply-luxury-identity.yml').unlink()
          PY

      - name: Run repository checks
        run: npm run check

      - name: Commit directly to main
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --stat
          git commit -m "feat: apply luxury Arabic ney visual identity"
          git push origin HEAD:main

      - name: Remove obsolete restore branch
        shell: bash
        run: git push origin --delete restore-2026-08-06-final-interface || true
