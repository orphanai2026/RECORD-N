name: Refine brand header layout

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/refine-brand-header.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply approved brand layout
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/refine_brand.py
          python3 /tmp/refine_brand.py
          npm run check
          rm .github/workflows/refine-brand-header.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html digital-tuner.css digital-tuner.js .github/workflows/refine-brand-header.yml
          git commit -m "style: free brand title with separate descriptor and A4 badge"
          git push origin main
