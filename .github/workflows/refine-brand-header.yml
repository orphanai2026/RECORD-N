name: Refine brand header layout

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/refine-brand-header.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply approved brand layout
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          index_path = Path('index.html')
          index = index_path.read_text()
          old = '''        <div class="brand-copy">
          <h1>معيار الناي</h1>
          <p>مسجل النغمات الشرقية الدقيقة وفق <bdi dir="ltr">A440</bdi></p>
        </div>'''
          new = '''        <div class="brand-copy">
          <h1>معيار الناي</h1>
          <div class="brand-meta" aria-label="وصف الأداة ومرجع الضبط">
            <span class="brand-description">مسجل ومعيار النغمات الشرقية</span>
            <span class="brand-reference"><bdi id="brandReferenceValue" dir="ltr">A4 = 440 Hz</bdi></span>
          </div>
        </div>'''
          if old not in index:
              raise SystemExit('Brand content anchor not found')
          index = index.replace(old, new, 1)
          index = index.replace('digital-tuner.css?v=2026-08-06-r2', 'digital-tuner.css?v=2026-08-06-r3', 1)
          index = index.replace('digital-tuner.js?v=2026-08-06-r2', 'digital-tuner.js?v=2026-08-06-r3', 1)
          index_path.write_text(index)

          css_path = Path('digital-tuner.css')
          css = css_path.read_text()
          css += r'''

/* Refined centered brand identity */
.brand-copy {
  min-width: 0;
  display: grid;
  justify-items: center;
  text-align: center;
}

.brand-copy h1 {
  margin: 0;
  color: #f5cf82;
  font-family: "Aref Ruqaa Ink", "Amiri", serif;
  font-size: clamp(3.55rem, 4.25vw, 4.85rem);
  line-height: .86;
  font-weight: 700;
  letter-spacing: 0;
  white-space: nowrap;
  background: linear-gradient(180deg, #ffe4a8 0%, #f5cf82 56%, #d79d45 100%);
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
  text-shadow: none;
  filter: drop-shadow(0 8px 13px rgba(0, 0, 0, .36));
}

.brand-meta {
  display: flex;
  align-items: center;
  justify-content: center;
  flex-wrap: wrap;
  gap: 7px 10px;
  margin-top: 10px;
  font-family: "IBM Plex Sans Arabic", "Segoe UI", Tahoma, Arial, sans-serif;
}

.brand-description {
  color: #eadfc8;
  font-size: .78rem;
  line-height: 1.5;
  font-weight: 500;
  white-space: nowrap;
}

.brand-reference {
  display: inline-flex;
  align-items: center;
  min-height: 27px;
  padding: 3px 10px;
  border: 1px solid rgba(245, 207, 130, .5);
  border-radius: 999px;
  color: #f5cf82;
  background: linear-gradient(145deg, rgba(5, 50, 52, .75), rgba(1, 24, 27, .94));
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .035), 0 5px 13px rgba(0, 0, 0, .18);
  font-size: .68rem;
  line-height: 1;
  font-weight: 600;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}

.app-header {
  min-height: 124px;
}

.brand {
  align-items: center;
  gap: 17px;
}

@media (max-width: 1240px) {
  .brand-copy h1 {
    font-size: 3.65rem;
  }
}

@media (max-width: 900px) {
  .brand-copy h1 {
    font-size: 3.15rem;
  }

  .brand-description {
    font-size: .7rem;
  }
}

@media (max-width: 640px) {
  .app-header {
    min-height: 112px;
  }

  .brand-copy h1 {
    font-size: 2.58rem;
    line-height: .92;
    white-space: normal;
  }

  .brand-meta {
    gap: 5px 7px;
    margin-top: 7px;
  }

  .brand-description {
    flex-basis: 100%;
    font-size: .64rem;
    white-space: normal;
  }

  .brand-reference {
    min-height: 24px;
    padding-inline: 8px;
    font-size: .62rem;
  }
}
'''
          css_path.write_text(css)

          js_path = Path('digital-tuner.js')
          js = js_path.read_text()
          js += r'''

(() => {
  'use strict';
  const referenceInput = document.getElementById('a4Reference');
  const badge = document.getElementById('brandReferenceValue');
  if (!referenceInput || !badge) return;

  const updateBrandReference = () => {
    const value = Number(referenceInput.value || 440);
    const formatted = Number.isInteger(value) ? value.toFixed(0) : value.toFixed(1);
    badge.textContent = `A4 = ${formatted} Hz`;
  };

  referenceInput.addEventListener('input', updateBrandReference);
  referenceInput.addEventListener('change', updateBrandReference);
  updateBrandReference();
})();
'''
          js_path.write_text(js)
          PY

          npm run check
          rm .github/workflows/refine-brand-header.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html digital-tuner.css digital-tuner.js .github/workflows/refine-brand-header.yml
          git commit -m "style: free brand title with separate descriptor and A4 badge"
          git push origin main
