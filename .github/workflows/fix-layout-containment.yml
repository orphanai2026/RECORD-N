name: Fix layout containment

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-layout-containment.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply layout-only fix
        shell: bash
        run: |
          cat >> styles.css <<'CSS'

/* Layout and containment correction — functionality and colors unchanged */
.bottom-grid {
  align-items: stretch;
  grid-template-columns: minmax(0, 2.15fr) minmax(390px, 1.28fr) minmax(250px, .82fr);
  grid-auto-rows: auto;
}
.bottom-grid > .panel {
  height: auto;
  min-height: 0;
  overflow: visible;
}
.recording-panel,
.recorder-panel,
.record-panel {
  min-width: 0;
  height: auto !important;
  max-height: none !important;
  overflow: visible !important;
  align-self: stretch;
}
.recording-workflow {
  min-width: 0;
  margin-bottom: .75rem;
  padding: .8rem;
}
.recording-workflow__header {
  align-items: center;
  gap: .7rem;
}
.recording-workflow__header h3 {
  font-size: 1.08rem;
  line-height: 1.25;
}
.recording-workflow__header p {
  font-size: .7rem;
  line-height: 1.5;
}
.recording-mode-control {
  min-width: 13.5rem;
}
.recording-session-status {
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: .45rem;
  margin-top: .7rem;
}
.recording-session-status > div {
  min-width: 0;
  padding: .55rem .45rem;
}
.recording-session-status span,
.recording-session-status strong {
  overflow-wrap: anywhere;
}
.chromatic-settings {
  grid-template-columns: repeat(2, minmax(0, 1fr));
}
.chromatic-settings > *,
.chromatic-progress,
.recording-workflow > * {
  min-width: 0;
  max-width: 100%;
}
.recording-workflow select,
.recording-workflow button,
.recording-workflow progress {
  max-width: 100%;
}
.metronome-panel {
  min-width: 0;
}
.tuner-scale {
  overflow: visible;
}
.tuner-bar {
  margin-top: 22px;
}
.tuner-needle-value {
  top: -2.7rem;
}
.tuner-limit {
  transform: translate(-50%, 7px);
}
.header-tabs .header-tab {
  padding-inline: .82rem;
}
@media (max-width: 1180px) {
  .bottom-grid {
    grid-template-columns: minmax(0, 1.55fr) minmax(340px, 1fr);
  }
  .metronome-panel {
    grid-column: 1 / -1;
  }
}
@media (max-width: 900px) {
  .bottom-grid {
    grid-template-columns: 1fr;
  }
  .bottom-grid > .panel,
  .recording-panel,
  .recorder-panel,
  .record-panel,
  .metronome-panel {
    grid-column: auto;
    width: 100%;
  }
  .recording-workflow__header {
    align-items: stretch;
  }
  .recording-mode-control {
    width: 100%;
    min-width: 0;
  }
}
@media (max-width: 640px) {
  .recording-session-status {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
  .chromatic-settings {
    grid-template-columns: 1fr;
  }
  .tuner-needle-value {
    top: -2.55rem;
  }
}
CSS
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          s = s.replace('styles.css?v=2026-08-06-r5', 'styles.css?v=2026-08-06-r6')
          p.write_text(s)
          PY
          npm run check
          rm .github/workflows/fix-layout-containment.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add styles.css index.html .github/workflows/fix-layout-containment.yml
          git commit -m "fix: correct recorder alignment and content containment"
          git push origin main
