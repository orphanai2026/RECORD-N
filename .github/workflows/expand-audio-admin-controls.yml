name: Expand audio and administrative controls

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/expand-audio-admin-controls.yml

permissions:
  contents: write

concurrency:
  group: record-n-audio-admin-controls
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Install local MP3 encoder
        shell: bash
        run: |
          mkdir -p vendor
          curl --fail --location --retry 3 \
            https://cdn.jsdelivr.net/npm/lamejs@1.2.1/lame.min.js \
            --output vendor/lame.min.js

      - name: Apply interface and functionality updates
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f'Missing replacement target: {label}')
              return text.replace(old, new, 1)

          index_path = Path('index.html')
          index = index_path.read_text(encoding='utf-8')

          index = index.replace('styles.css?v=2026-08-06-r2', 'styles.css?v=2026-08-06-r3')
          index = index.replace('calibration.css?v=2026-08-06-r2', 'calibration.css?v=2026-08-06-r3')
          index = index.replace('app.js?v=2026-08-06-r2', 'app.js?v=2026-08-06-r3')
          index = replace_once(
              index,
              '  <script src="app.js?v=2026-08-06-r3" defer></script>',
              '  <script src="vendor/lame.min.js?v=1.2.1" defer></script>\n  <script src="app.js?v=2026-08-06-r3" defer></script>',
              'MP3 encoder script'
          )

          index = replace_once(
              index,
              '''          <div class="tuner-bar">
            <span class="tuner-center-zone" aria-hidden="true"></span>
            <span class="tuner-needle" id="tunerNeedle" aria-hidden="true"></span>
          </div>''',
              '''          <div class="tuner-bar" id="tunerBar">
            <span class="tuner-center-zone" id="tunerCenterZone" aria-hidden="true"></span>
            <span class="tuner-limit tuner-limit--low" id="tunerLowLimit" aria-hidden="true"><bdi id="tunerLowLabel" dir="ltr">-12</bdi></span>
            <span class="tuner-limit tuner-limit--high" id="tunerHighLimit" aria-hidden="true"><bdi id="tunerHighLabel" dir="ltr">+12</bdi></span>
            <span class="tuner-needle" id="tunerNeedle" aria-hidden="true"></span>
          </div>''',
              'tuner tolerance markers'
          )

          index = replace_once(
              index,
              '''          <div class="stepper" role="group" aria-label="ضبط النبض">
            <button type="button" id="bpmMinus" aria-label="خفض النبض"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"></path></svg></button>
            <output id="bpmValue" dir="ltr">60</output>
            <button type="button" id="bpmPlus" aria-label="رفع النبض"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14"></path><path d="M5 12h14"></path></svg></button>
          </div>''',
              '''          <div class="stepper numeric-stepper" role="group" aria-label="ضبط النبض">
            <button type="button" id="bpmMinus" aria-label="خفض النبض"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"></path></svg></button>
            <input id="bpmValue" type="number" min="30" max="240" step="1" value="60" inputmode="numeric" dir="ltr" aria-label="قيمة النبض BPM">
            <button type="button" id="bpmPlus" aria-label="رفع النبض"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14"></path><path d="M5 12h14"></path></svg></button>
          </div>''',
              'editable BPM input'
          )

          index = replace_once(
              index,
              '''          <label class="reference-input"><input id="a4Reference" type="number" min="400" max="480" step="0.1" value="440" inputmode="decimal" aria-label="مرجع A4"><span>Hz</span></label>''',
              '''          <div class="stepper numeric-stepper reference-stepper" role="group" aria-label="ضبط مرجع A4">
            <button type="button" id="a4Minus" aria-label="خفض مرجع A4"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"></path></svg></button>
            <label class="reference-input"><input id="a4Reference" type="number" min="400" max="480" step="0.1" value="440" inputmode="decimal" dir="ltr" aria-label="مرجع A4"><span>Hz</span></label>
            <button type="button" id="a4Plus" aria-label="رفع مرجع A4"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14"></path><path d="M5 12h14"></path></svg></button>
          </div>''',
