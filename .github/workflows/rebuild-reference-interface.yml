name: Rebuild approved reference interface

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/rebuild-reference-interface.yml

permissions:
  contents: write

concurrency:
  group: record-n-reference-rebuild
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      INDEX_DATA: 
      STYLES_DATA: 
      APP_DATA: 

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Replace interface and remove obsolete layers
        shell: bash
        run: |
          python - <<'PY'
          import base64, gzip, os
          from pathlib import Path

          files = {
              'index.html': os.environ['INDEX_DATA'],
              'styles.css': os.environ['STYLES_DATA'],
              'app.js': os.environ['APP_DATA'],
          }
          for path, data in files.items():
              Path(path).write_bytes(gzip.decompress(base64.b64decode(data)))

          Path('scripts/check.mjs').write_text(r'''import { access, readFile } from "node:fs/promises";
          import { Script } from "node:vm";

          const required = ["index.html", "styles.css", "app.js", "assets/ney-dokah-reference.webp", "VERSION.json", "README.md", "COPYRIGHT.md", "LICENSE.md"];
          const obsolete = ["theme-base.css", "theme-approved.css", "theme-oriental.css", "theme-oriental-r4.css", "theme-ney-luxury.css", "theme-reference-match.css", "ui-rebuild.js", "ui-enhancements.js", "ui-approved.js", "vendor/jszip.min.js", "vendor/jszip-core.min.js", "audio-recorder-worklet.js"];
          const failures = [];
          for (const file of required) { try { await access(file); } catch { failures.push(`Missing required file: ${file}`); } }
          for (const file of obsolete) { try { await access(file); failures.push(`Obsolete file remains: ${file}`); } catch {} }
          const html = await readFile("index.html", "utf8");
          const css = await readFile("styles.css", "utf8");
          const js = await readFile("app.js", "utf8");
          for (const token of ["lang=\"ar\"", "dir=\"rtl\"", "styles.css", "app.js", "id=\"micButton\"", "id=\"recordingsList\""]) if (!html.includes(token)) failures.push(`index.html missing ${token}`);
          if (/<style[\\s>]/i.test(html)) failures.push("index.html contains inline CSS");
          if (/<script(?![^>]*\\bsrc=)[^>]*>[\\s\\S]*?<\\/script>/i.test(html)) failures.push("index.html contains inline application JavaScript");
          for (const token of ["--gold-100", ".top-grid", ".bottom-grid", ".note-rosette", ".tuner-bar", "@media (max-width: 1200px)", "@media (max-width: 900px)", "@media (max-width: 640px)", "prefers-reduced-motion"]) if (!css.includes(token)) failures.push(`styles.css missing ${token}`);
          for (const token of ["getUserMedia", "MediaRecorder", "autocorrelate", "noteFromFrequency", "showToast", "renderRecords"]) if (!js.includes(token)) failures.push(`app.js missing ${token}`);
          try { new Script(js, { filename: "app.js" }); } catch (error) { failures.push(`app.js syntax error: ${error.message}`); }
          if (failures.length) { failures.forEach(item => console.error(`- ${item}`)); process.exit(1); }
          console.log("Repository checks passed: real RTL HTML/CSS/Vanilla JS reference interface.");
          '''.replace(/^          /gm, ''), encoding='utf-8')

          obsolete = [
              'theme-base.css', 'theme-approved.css', 'theme-oriental.css',
              'theme-oriental-r4.css', 'theme-ney-luxury.css',
              'theme-reference-match.css', 'ui-rebuild.js',
              'ui-enhancements.js', 'ui-approved.js',
              'vendor/jszip.min.js', 'vendor/jszip-core.min.js',
              'audio-recorder-worklet.js'
          ]
          for filename in obsolete:
              path = Path(filename)
              if path.exists(): path.unlink()
          vendor = Path('vendor')
          if vendor.exists() and not any(vendor.iterdir()): vendor.rmdir()
          Path('.github/workflows/rebuild-reference-interface.yml').unlink()
          PY

      - name: Run quality checks
        run: npm run check

      - name: Commit directly to main
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --stat
          git commit -m "feat: rebuild approved ney reference interface"
          git push origin HEAD:main
